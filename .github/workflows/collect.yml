name: Collect freight stops

on:
  schedule:
    - cron: "7,37 * * * *"   # backup + self-revival if the chain ever breaks
  workflow_dispatch:          # manual run from the Actions tab
  repository_dispatch:        # optional external trigger (cron-job.org etc.)
    types: [collect]

# One run at a time. Extra triggers collapse into a single waiting run,
# so the self-chain, the schedule and any external pinger never pile up.
concurrency:
  group: collect-stops
  cancel-in-progress: false

permissions:
  contents: write             # push the updated stops.json
  actions: write              # let the workflow start its own next run

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run collector
        run: python collect.py

      - name: Commit updated stops.json
        run: |
          git add stops.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update stops.json ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            echo "Push attempt $i failed, retrying..."
            sleep $((i * 5))
          done
          echo "Push failed after 5 attempts"
          exit 1

      # Self-chain: wait until the next :07 or :37 UTC, then start a new run.
      # Runs even if the collector failed, so one bad run doesn't stop the loop.
      # To stop the loop: repo Settings > Secrets and variables > Actions >
      # Variables > add CHAIN = off
      - name: Schedule next run
        if: ${{ always() && vars.CHAIN != 'off' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          now=$(date -u +%s)
          min=$(date -u +%-M)
          sec=$(date -u +%-S)
          if   [ "$min" -lt 7 ];  then wait=$(( (7  - min) * 60 - sec ))
          elif [ "$min" -lt 37 ]; then wait=$(( (37 - min) * 60 - sec ))
          else                         wait=$(( (67 - min) * 60 - sec ))
          fi
          [ "$wait" -lt 60 ] && wait=60
          echo "Sleeping ${wait}s until next slot"
          sleep "$wait"
          gh workflow run "Collect freight stops" --ref main --repo "$GITHUB_REPOSITORY"
