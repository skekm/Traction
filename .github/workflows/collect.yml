name: Collect freight stops

on:
  schedule:
    - cron: "17 * * * *"   # hourly at :17 (use "17 */2 * * *" for every 2 hours)
  workflow_dispatch:        # lets you run it manually from the Actions tab

# Only one run at a time, so two runs never write stops.json together
concurrency:
  group: collect-stops
  cancel-in-progress: false

permissions:
  contents: write           # needed to push the updated stops.json

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run collector
        run: python collect.py

      - name: Commit updated stops.json
        run: |
          git add stops.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update stops.json ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          git pull --rebase
          git push
